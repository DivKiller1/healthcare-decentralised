apiVersion: apps/v1
kind: Deployment
metadata:
  name: govt-ops-deployment
  namespace: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: govt-ops-service
  template:
    metadata:
      labels:
        app: govt-ops-service
    spec:
      containers:
        - name: govt-ops-service
          image: govt-ops-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: govt-ops-svc
  namespace: backend
spec:
  selector:
    app: govt-ops-service
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: govt-ops-service-hpa
  namespace: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: govt-ops-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
