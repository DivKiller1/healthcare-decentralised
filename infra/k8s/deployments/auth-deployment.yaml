apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  namespace: backend
spec:
  selector:
    app: auth-service
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
