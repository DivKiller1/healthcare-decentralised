events {}

http {
    server {
        listen 80;

        # Public Portal
        location / {
            proxy_pass http://public-portal:80;
        }

        # Govt Portal
        location /govt {
            rewrite ^/govt(.*)$ /$1 break;
            proxy_pass http://govt-portal:80;
        }

        # Admin Portal
        location /admin {
            rewrite ^/admin(.*)$ /$1 break;
            proxy_pass http://admin-portal:80;
        }

        # API Gateway Routing
        location /api/auth {
            rewrite ^/api/auth(.*)$ $1 break;
            proxy_pass http://auth-service:8000;
        }
        location /api/user {
            rewrite ^/api/user(.*)$ $1 break;
            proxy_pass http://user-service:8000;
        }
        location /api/facility {
            rewrite ^/api/facility(.*)$ $1 break;
            proxy_pass http://facility-service:8000;
        }
        location /api/request {
            rewrite ^/api/request(.*)$ $1 break;
            proxy_pass http://request-service:8000;
        }
        location /api/routing {
            rewrite ^/api/routing(.*)$ $1 break;
            proxy_pass http://routing-service:8000;
        }
        location /api/govt-ops {
            rewrite ^/api/govt-ops(.*)$ $1 break;
            proxy_pass http://govt-ops-service:8000;
        }
        location /api/metrics {
            rewrite ^/api/metrics(.*)$ $1 break;
            proxy_pass http://metrics-service:8000;
        }
        location /api/audit {
            rewrite ^/api/audit(.*)$ $1 break;
            proxy_pass http://audit-service:8000;
        }
    }
}
