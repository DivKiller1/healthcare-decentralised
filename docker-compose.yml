services:
  # Infrastructure
  healthcare-db:
    image: postgres:15-alpine
    container_name: healthcare-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: healthcare_db
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [healthcare-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d healthcare_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  healthcare-redis:
    image: redis:alpine
    container_name: healthcare-redis
    ports: ["6379:6379"]
    networks: [healthcare-net]

  # Database migrations (one-shot). Runs `alembic upgrade head`, then exits.
  db-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: "postgresql+asyncpg://user:password@healthcare-db:5432/healthcare_db"
    depends_on:
      healthcare-db:
        condition: service_healthy
    networks: [healthcare-net]
    restart: "no"

  # Backend Services
  auth-service:
    build: ./backend/auth-service
    environment:
      DATABASE_URL: "postgresql+asyncpg://user:password@healthcare-db:5432/healthcare_db"
      REDIS_URL: "redis://healthcare-redis:6379/0"
      JWT_SECRET: "supersecretkey"
      AUDIT_SERVICE_URL: "http://audit-service:8000"
    depends_on:
      healthcare-db:
        condition: service_healthy
      healthcare-redis:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    networks: [healthcare-net]

  user-service:
    build: ./backend/user-service
    environment:
      DATABASE_URL: "postgresql+asyncpg://user:password@healthcare-db:5432/healthcare_db"
      JWT_SECRET: "supersecretkey"
    depends_on:
      healthcare-db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks: [healthcare-net]

  facility-service:
    build: ./backend/facility-service
    environment:
      DATABASE_URL: "postgresql+asyncpg://user:password@healthcare-db:5432/healthcare_db"
      JWT_SECRET: "supersecretkey"
      AUDIT_SERVICE_URL: "http://audit-service:8000"
    depends_on:
      healthcare-db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks: [healthcare-net]

  request-service:
    build: ./backend/request-service
    environment:
      DATABASE_URL: "postgresql+asyncpg://user:password@healthcare-db:5432/healthcare_db"
      JWT_SECRET: "supersecretkey"
      AUDIT_SERVICE_URL: "http://audit-service:8000"
    depends_on:
      healthcare-db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks: [healthcare-net]

  routing-service:
    build: ./backend/routing-service
    environment:
      DATABASE_URL: "postgresql+asyncpg://user:password@healthcare-db:5432/healthcare_db"
      AUDIT_SERVICE_URL: "http://audit-service:8000"
    depends_on:
      healthcare-db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks: [healthcare-net]

  govt-ops-service:
    build: ./backend/govt-ops-service
    environment:
      DATABASE_URL: "postgresql+asyncpg://user:password@healthcare-db:5432/healthcare_db"
      JWT_SECRET: "supersecretkey"
      ROUTING_SERVICE_URL: "http://routing-service:8000"
    depends_on:
      healthcare-db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks: [healthcare-net]

  metrics-service:
    build: ./backend/metrics-service
    environment:
      DATABASE_URL: "postgresql+asyncpg://user:password@healthcare-db:5432/healthcare_db"
      JWT_SECRET: "supersecretkey"
      AUDIT_SERVICE_URL: "http://audit-service:8000"
    depends_on:
      healthcare-db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks: [healthcare-net]

  audit-service:
    build: ./backend/audit-service
    environment:
      DATABASE_URL: "postgresql+asyncpg://user:password@healthcare-db:5432/healthcare_db"
      JWT_SECRET: "supersecretkey"
    depends_on:
      healthcare-db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks: [healthcare-net]

  # Frontend Portals
  public-portal:
    build: ./frontend/public-portal
    networks: [healthcare-net]

  govt-portal:
    build: ./frontend/govt-portal
    networks: [healthcare-net]

  admin-portal:
    build: ./frontend/admin-portal
    networks: [healthcare-net]

  # API Gateway
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    volumes:
      - ./infra/local-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - user-service
      - facility-service
      - request-service
      - public-portal
      - govt-portal
      - admin-portal
    networks: [healthcare-net]

networks:
  healthcare-net:
    driver: bridge

volumes:
  postgres_data:
